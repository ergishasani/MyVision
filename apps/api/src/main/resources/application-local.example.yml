spring:
  datasource:
    # Use the session pooler host (IPv4-friendly on Windows). Find yours in Supabase → Settings → Database.
    url: jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres
    username: postgres.toyrbakpcbcishmaulbg
    password: ${SUPABASE_DB_PASSWORD:YOUR_SUPABASE_DB_PASSWORD}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:replace-this-with-a-long-random-secret}
  expiration-ms: 86400000

auth:
  return-sensitive-tokens: true
  frontend-base-url: http://localhost:3000
  oauth:
    google-client-ids: ${AUTH_GOOGLE_CLIENT_IDS:your-google-oauth-client-id.apps.googleusercontent.com}
    apple-client-id: ${AUTH_APPLE_CLIENT_ID:your.apple.service.id}

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  rate-limit:
    enabled: true
    max-requests: 120
    window-ms: 60000

springdoc:
  enabled: true
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

mail:
  provider: log
  from: MyVision <no-reply@myvision.visionbau.de>

storage:
  provider: local
  local-root: .myvision-storage
  public-base-url: http://localhost:8080/files
