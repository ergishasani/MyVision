spring:
  application:
    name: myvision-api

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/myvision}
    username: ${DATABASE_USERNAME:myvision}
    password: ${DATABASE_PASSWORD:myvision}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:replace-this-with-a-long-random-secret-for-local-dev-only}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

