spring:
  application:
    name: myvision-api

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/myvision}
    username: ${DATABASE_USERNAME:myvision}
    password: ${DATABASE_PASSWORD:myvision}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:replace-this-with-a-long-random-secret-for-local-dev-only}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

auth:
  oauth:
    google-client-ids: ${AUTH_GOOGLE_CLIENT_IDS:}
    apple-client-id: ${AUTH_APPLE_CLIENT_ID:}
  refresh-token-expiration-ms: ${AUTH_REFRESH_TOKEN_EXPIRATION_MS:2592000000}
  password-reset-expiration-ms: ${AUTH_PASSWORD_RESET_EXPIRATION_MS:3600000}
  email-verification-expiration-ms: ${AUTH_EMAIL_VERIFICATION_EXPIRATION_MS:86400000}
  return-sensitive-tokens: ${AUTH_RETURN_SENSITIVE_TOKENS:false}
  frontend-base-url: ${AUTH_FRONTEND_BASE_URL:http://localhost:3000}
  rate-limit:
    max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:900000}

mail:
  provider: ${MAIL_PROVIDER:log}
  from: ${MAIL_FROM:MyVision <no-reply@myvision.visionbau.de>}
  resend:
    api-key: ${RESEND_API_KEY:}
    endpoint: ${RESEND_ENDPOINT:https://api.resend.com/emails}

storage:
  provider: ${STORAGE_PROVIDER:local}
  local-root: ${STORAGE_LOCAL_ROOT:.myvision-storage}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    documents-bucket: ${SUPABASE_DOCUMENTS_BUCKET:myvision-documents}
    public-bucket: ${SUPABASE_PUBLIC_BUCKET:myvision-public}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    max-requests: ${APP_RATE_LIMIT_MAX_REQUESTS:120}
    window-ms: ${APP_RATE_LIMIT_WINDOW_MS:60000}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

compliance:
  invoice-country: ${COMPLIANCE_INVOICE_COUNTRY:DE}
  xrechnung:
    enabled: ${COMPLIANCE_XRECHNUNG_ENABLED:true}
