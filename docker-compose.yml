services:
  postgres:
    image: postgres:16
    container_name: myvision-postgres
    environment:
      POSTGRES_DB: myvision
      POSTGRES_USER: myvision
      POSTGRES_PASSWORD: myvision
    ports:
      - "5432:5432"
    volumes:
      - myvision-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvision -d myvision"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    container_name: myvision-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/myvision
      DATABASE_USERNAME: myvision
      DATABASE_PASSWORD: myvision
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret-for-local-dev-only}
      AUTH_FRONTEND_BASE_URL: ${AUTH_FRONTEND_BASE_URL:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: ${MAIL_FROM:-MyVision <no-reply@myvision.visionbau.de>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-.myvision-storage}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8080/files}
      SUPABASE_URL: ${SUPABASE_URL:-https://toyrbakpcbcishmaulbg.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_DOCUMENTS_BUCKET: ${SUPABASE_DOCUMENTS_BUCKET:-myvision-documents}
      SUPABASE_PUBLIC_BUCKET: ${SUPABASE_PUBLIC_BUCKET:-myvision-public}
    ports:
      - "8080:8080"

volumes:
  myvision-postgres-data:
