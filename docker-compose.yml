services:
  postgres:
    image: postgres:16
    container_name: myvision-postgres
    environment:
      POSTGRES_DB: myvision
      POSTGRES_USER: myvision
      POSTGRES_PASSWORD: myvision
    ports:
      - "5432:5432"
    volumes:
      - myvision-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvision -d myvision"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./engine
    container_name: myvision-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/myvision
      DATABASE_USERNAME: myvision
      DATABASE_PASSWORD: myvision
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret-for-local-dev-only}
      AUTH_FRONTEND_BASE_URL: ${AUTH_FRONTEND_BASE_URL:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_MAX_REQUESTS: ${APP_RATE_LIMIT_MAX_REQUESTS:-120}
      APP_RATE_LIMIT_WINDOW_MS: ${APP_RATE_LIMIT_WINDOW_MS:-60000}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: ${MAIL_FROM:-MyVision <no-reply@myvision.visionbau.de>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/.myvision-storage}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8080/files}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/invoices?payment=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/invoices?payment=cancelled}
      APP_SCHEDULING_ENABLED: ${APP_SCHEDULING_ENABLED:-true}
      INVOICES_OVERDUE_SWEEP_CRON: ${INVOICES_OVERDUE_SWEEP_CRON:-0 10 2 * * *}
      AUTH_TOKEN_CLEANUP_CRON: ${AUTH_TOKEN_CLEANUP_CRON:-0 30 3 * * *}
      AUTH_TOKEN_CLEANUP_RETENTION_DAYS: ${AUTH_TOKEN_CLEANUP_RETENTION_DAYS:-7}
    ports:
      - "8080:8080"
    volumes:
      # Generated invoice PDFs and XRechnung XML live here. Without this the
      # container loses every stored document on restart. Mounted on the path the
      # image already creates and chowns to appuser, so the non-root runtime user
      # can actually write to the volume.
      - myvision-storage-data:/app/.myvision-storage

volumes:
  myvision-postgres-data:
  myvision-storage-data:
