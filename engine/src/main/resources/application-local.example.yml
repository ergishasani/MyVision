spring:
  datasource:
    # Matches the postgres service in docker-compose.yml. Point this at any
    # PostgreSQL instance you like.
    url: jdbc:postgresql://localhost:5432/myvision
    username: myvision
    password: ${DATABASE_PASSWORD:myvision}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:replace-this-with-a-long-random-secret}
  expiration-ms: 86400000

auth:
  return-sensitive-tokens: true
  frontend-base-url: http://localhost:3000
  oauth:
    google-client-ids: ${AUTH_GOOGLE_CLIENT_IDS:your-google-oauth-client-id.apps.googleusercontent.com}
    apple-client-id: ${AUTH_APPLE_CLIENT_ID:your.apple.service.id}

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  rate-limit:
    enabled: true
    max-requests: 120
    window-ms: 60000

springdoc:
  enabled: true
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

mail:
  provider: log
  from: MyVision <no-reply@myvision.visionbau.de>

storage:
  local-root: .myvision-storage
  public-base-url: http://localhost:8080/files
